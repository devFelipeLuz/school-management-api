services:

  postgres:
    image: postgres:16
    container_name: postgres-dev

    environment:
      POSTGRES_DB: school
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .

    container_name: school-api

    depends_on:
      - postgres

    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/school
      SPRING_PROFILES_ACTIVE: dev

    ports:
      - "8080:8080"

volumes:
  postgres-data: